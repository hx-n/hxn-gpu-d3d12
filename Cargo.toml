[package]
name = "hxn-gpu-d3d12"
version = "0.2.0"
edition = "2024"
description = "Direct3D 12 for Haxe: devices, resources, root signatures, pipeline states and command lists with explicit resource barriers"
repository = "https://github.com/hx-n/hxn-gpu-d3d12"
license = "Apache-2.0"
keywords = ["d3d12", "direct3d", "gpu", "haxe", "graphics", "compute", "hlsl", "windows", "native", "hxcpp", "hashlink", "cross"]

[lib]
name = "hxn_gpu_d3d12"

[package.metadata.hxn]
# The native library is `gpu_d3d12.hdll` or `gpu_d3d12_cpp.lib`.
library = "gpu_d3d12"
haxelib = "hxn-gpu-d3d12"
contributors = ["darmie", "rayzor"]
releasenote = "Moves to the hxn.gpu.d3d12 package, on hxn 0.3.5."
# The check `hxn check` and `hxn run` build.
haxe = "examples/check"
haxe-flags = ["-lib", "hxnsl"]
# Registers hxnsl's HLSL target for hxn.gpu.d3d12.Shader, from sources/.
init = ["hxn.gpu.d3d12.Shaders.register()"]

[dependencies]
hxn = { git = "https://github.com/hx-n/hxn.git", tag = "v0.3.5" }
hxn-future = { git = "https://github.com/hx-n/hxn.git", tag = "v0.3.5" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
